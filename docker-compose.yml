version: "3.9"

services:
  db:
    image: postgres:15
    env_file:
      - .env
    container_name: rcm-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rcm-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/alembic:/app/alembic
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rcm-frontend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
